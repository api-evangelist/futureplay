name: Futureplay
description: 'Futureplay is a Helsinki, Finland-based mobile game studio founded in 2015 that develops
  free-to-play games for a global audience, having released six titles for more than 120 million players
  including Merge Gardens, Battlelands Royale, and Idle Farming Empire. Backed by Creandum and now part of
  Plarium, the studio operates in the consumer gaming sector. Futureplay publishes no public developer API,
  SDK, MCP server, or developer portal; player-facing support runs through a Zendesk help center, and legal
  terms are hosted on the Plarium company site.'
